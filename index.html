async function loadProgressStats() {
  if (!state.userId) return;
  try {
    const { count: completedCount } = await sb.from('lesson_progress').select('*', { count: 'exact', head: true }).eq('user_id', state.userId).eq('status', 'completed');
    state.completedCount = completedCount || 0;
    state.totalLessons = LESSONS.length;
    const { data: completedRows } = await sb.from('lesson_progress').select('lesson_id').eq('user_id', state.userId).eq('status', 'completed');
    state.completedLessonIds = new Set((completedRows||[]).map(r=>r.lesson_id));
    const { count: recordingsCount } = await sb.from('recordings').select('*', { count: 'exact', head: true }).eq('user_id', state.userId);
    state.recordingsCount = recordingsCount || 0;
    const { data: recent } = await sb.from('recordings').select('kind, created_at').eq('user_id', state.userId).order('created_at', { ascending: false }).limit(5);
    state.recentRecordings = recent || [];
  } catch(e) {}

function isLevelUnlocked(level) { return level <= 1 || state.readinessLevel >= level - 1; }
function levelFullyCompleted(level) {
  const lessonsInLevel = LESSONS.filter(l => l.level === level);
  if (!lessonsInLevel.length) return false;
  return lessonsInLevel.every(l => state.completedLessonIds.has(l.id));
}
function pendingReadinessLevel() {
  const maxLevel = Math.max(...LESSONS.map(l=>l.level||1), 1);
  for (let lvl = state.readinessLevel + 1; lvl <= maxLevel; lvl++) {
    if (isLevelUnlocked(lvl) && levelFullyCompleted(lvl) && state.readinessLevel < lvl) return lvl;
  }
  return null;
}
async function passReadiness(level) {
  state.readinessLevel = Math.max(state.readinessLevel, level);
  await saveProfile({ readiness_level: state.readinessLevel });
}

async function loadStreak() {
  if (!state.userId) return;
  try {
    const { data: rows } = await sb.from('daily_activity').select('activity_date').eq('user_id', state.userId).order('activity_date', { ascending: false }).limit(400);
    if (!rows || !rows.length) { state.streak = 0; return; }
    const dates = new Set(rows.map(r => r.activity_date));
    let streak = 0;
    let cursor = new Date();
    const todayStr = cursor.toISOString().slice(0,10);
    if (!dates.has(todayStr)) cursor.setDate(cursor.getDate() - 1);
    while (dates.has(cursor.toISOString().slice(0,10))) { streak++; cursor.setDate(cursor.getDate() - 1); }
    state.streak = streak;
  } catch(e) { state.streak = 0; }
}

  if (profile) {
    const idx = FONT_SCALES.indexOf(Number(profile.font_scale));
    state.track = profile.track || null;
    state.fontScaleIdx = idx >= 0 ? idx : 1;
    state.avgWpm = profile.avg_wpm || null;
    state.readinessLevel = profile.readiness_level || 0;
    state.shareCode = profile.share_code || null;
    state.notifEnabled = !!profile.notif_enabled;
    state.screen = profile.track ? 'home' : 'test';
    state.activeTab = 'home';

async function startRecording() {
  audioChunks = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaStream = stream;
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.start();
    state.micError = '';
    return true;
  } catch(e) { state.micError = 'تعذّر الوصول للميكروفون'; return false; }
}
function stopRecordingAndSave(kind, lessonId, durationSeconds) {
  return new Promise(resolve => {
    if (!mediaRecorder || mediaRecorder.state==='inactive') { resolve(null); return; }
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
      const url = URL.createObjectURL(blob);
      state.myRecordingUrl = url;
      uploadRecording(blob, kind, lessonId, durationSeconds);
      resolve(url);
    };
    mediaRecorder.stop();
  });
}
async function uploadRecording(blob, kind, lessonId, durationSeconds) {
  if (!state.userId) return;
  try {
    const path = `${state.userId}/${kind}_${Date.now()}.webm`;
    const { error } = await sb.storage.from('recordings').upload(path, blob, { contentType: 'audio/webm' });
    if (error) return;
    await sb.from('recordings').insert({ user_id: state.userId, kind, lesson_id: kind==='mimicry'?lessonId:null, audio_url: path, duration_seconds: durationSeconds || null });

}

  state.avgWpm = state.avgWpm ? Math.round(state.avgWpm*0.7 + wpm*0.3) : wpm;

}

const ELEVENLABS_VOICE_ID = 'pNInz6obpgDQGcFmaJgB';
const TTS_PROXY_URL = `${SUPABASE_URL}/functions/v1/tts-proxy`;
const TTS_CACHE_KEY = 'amie_tts_cache_v1';
const TTS_CACHE_MAX = 40;
let _currentAudio = null;

function ttsCacheKey(text) { let h = 0; for (let i=0;i<text.length;i++) { h = (h*31 + text.charCodeAt(i))|0; } return 'k'+h; }
function readTtsCache() { try { return JSON.parse(localStorage.getItem(TTS_CACHE_KEY) || '{}'); } catch(e) { return {}; } }
function writeTtsCache(cache) {
  const keys = Object.keys(cache);
  if (keys.length > TTS_CACHE_MAX) { keys.sort((a,b)=>cache[a]._t-cache[b]._t); keys.slice(0, keys.length-TTS_CACHE_MAX).forEach(k=>delete cache[k]); }
  try { localStorage.setItem(TTS_CACHE_KEY, JSON.stringify(cache)); } catch(e) {}
}
function blobToBase64(blob) { return new Promise((res,rej) => { const r = new FileReader(); r.onloadend = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }

async function speakTextEL(text, onEnd) {
  const key = ttsCacheKey(text);
  const cache = readTtsCache();
  if (cache[key]) {
    if (_currentAudio) _currentAudio.pause();
    _currentAudio = new Audio(cache[key].data);
    if (onEnd) _currentAudio.onended = onEnd;
    _currentAudio.onerror = () => { if (onEnd) onEnd(); };
    await _currentAudio.play();
    return;
  }
  try {
    const res = await fetch(TTS_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ text, voiceId: ELEVENLABS_VOICE_ID }),
    });
    if (!res.ok) throw new Error('TTS proxy request failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (_currentAudio) { _currentAudio.pause(); }
    _currentAudio = new Audio(url);
    if (onEnd) _currentAudio.onended = onEnd;

function render() {
  document.getElementById('shell').innerHTML = screens();
  const emailInput = document.getElementById('emailInput');
  if (emailInput) emailInput.oninput = e => { state.email = e.target.value; state.authError=''; };
  const otpInput = document.getElementById('otpInput');
  if (otpInput) otpInput.oninput = e => { state.otpCode = e.target.value; state.authError=''; };
}

function startPlayback(text, mode, item) {
  if (playTimer) clearInterval(playTimer);
  stopSpeaking();
  if (item && item.audioUrl && item.alignment) { playWithAlignmentAudio(item, mode); return; }
  const toks = tokensFor(text, mode);
  const speed = mode === 'letter' ? 150 : 480;
  state._playing = true; state._playIdx = 0;
  speakTextEL(text, () => {});
  playTimer = setInterval(() => {
    state._playIdx++;
    if (state._playIdx >= toks.length) { clearInterval(playTimer); state._playing=false; state._playIdx=-1; }
    render();
  }, speed);
}
function autoPlayCurrent() {
  if (state.screen === 'lesson') {
    const lesson = LESSONS.find(l=>l.id===state.currentLessonId);
    if (lesson) startPlayback(lesson.text, state.highlightMode, lesson);
  } else if (state.screen === 'scenario-detail') {
    const sc = SCENARIOS.find(x=>x.id===state.activeScenarioId);
    if (sc) startPlayback(sc.text, 'word', sc);
  }
}

document.getElementById('app').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id ? Number(btn.dataset.id) : null;
  if (act==='goauth') state.screen='auth-phone';
  else if (act==='openreadiness') { state.screen='readiness'; state.readinessTargetLevel=Number(id); state.fluencyStage='idle'; state.fluencyElapsed=0; }
  else if (act==='startreadinessreading') {
    state.fluencyStage='reading'; state.fluencyElapsed=0; render();
    await startRecording();
    fluencyTimer = setInterval(() => { state.fluencyElapsed++; render(); }, 1000);
    return;
  }
  else if (act==='finishreadinessreading') {
    if (fluencyTimer) clearInterval(fluencyTimer);
    await stopRecordingAndSave('fluency', null, state.fluencyElapsed);
    await passReadiness(state.readinessTargetLevel);
    state.fluencyStage='done';
  }
  else if (act==='sendotp') return sendOtp();
  else if (act==='verifyotp') return verifyOtp();
  else if (act==='backtophone') { state.screen='auth-phone'; state.otpCode=''; state.authError=''; }
  else if (act==='setelder') { state.track='elder'; state.screen='home'; state.activeTab='home'; state.highlightMode='letter'; saveProfile({track:'elder'}); }
  else if (act==='setnonnative') { state.track='nonnative'; state.screen='home'; state.activeTab='home'; state.highlightMode='word'; saveProfile({track:'nonnative'}); }
  else if (act==='gohome') { state.screen='home'; state.activeTab='home'; }
  else if (act==='golessons') { state.screen='lessons'; state.activeTab='lessons'; }
  else if (act==='goscenarios') { state.screen='scenarios'; state.activeTab='scenarios'; }
  else if (act==='goprofile') { state.screen='profile'; state.activeTab='profile'; loadProgressStats().then(render); }
  else if (act==='gofluency') { state.screen='fluency'; state.fluencyStage='idle'; state.fluencyElapsed=0; }
  else if (act==='openlesson') { state.currentLessonId=id; state.screen='lesson'; state.highlightMode = state.track==='elder'?'letter':'word'; state._playing=false; state._playIdx=-1; render(); autoPlayCurrent(); return; }
  else if (act==='openmimicry') { if(id) state.currentLessonId=id; state.screen='mimicry'; state.mimicryStage='idle'; }
  else if (act==='openscenario') { state.activeScenarioId=id; state.screen='scenario-detail'; state._playing=false; state._playIdx=-1; render(); autoPlayCurrent(); return; }
  else if (act==='back') { if(['lesson','fluency','readiness'].includes(state.screen)) state.screen='home'; else if(state.screen==='mimicry') state.screen='lesson'; else if(state.screen==='scenario-detail') state.screen='scenarios'; else state.screen=state.activeTab; state._playing=false; stopSpeaking(); if(playTimer) clearInterval(playTimer); }
  else if (act==='fontup') { state.fontScaleIdx=Math.min(2,state.fontScaleIdx+1); saveProfile({font_scale:FONT_SCALES[state.fontScaleIdx]}); }
  else if (act==='fontdown') { state.fontScaleIdx=Math.max(0,state.fontScaleIdx-1); saveProfile({font_scale:FONT_SCALES[state.fontScaleIdx]}); }
  else if (act==='setfont') { state.fontScaleIdx=Number(btn.dataset.idx); saveProfile({font_scale:FONT_SCALES[state.fontScaleIdx]}); }
  else if (act==='modeletter') state.highlightMode='letter';
  else if (act==='modeword') state.highlightMode='word';
  else if (act==='resetplay') { state._playing=false; state._playIdx=-1; if(playTimer) clearInterval(playTimer); }
  else if (act==='toggleplay') {
    if (state._playing) { if(playTimer) clearInterval(playTimer); stopSpeaking(); state._playing=false; }
    else {
      const item = state.screen==='scenario-detail' ? SCENARIOS.find(x=>x.id===state.activeScenarioId) : LESSONS.find(x=>x.id===state.currentLessonId);
      const mode = state.screen==='scenario-detail' ? 'word' : state.highlightMode;
      startPlayback(item.text, mode, item);
    }
  }
  else if (act==='playmodel') { const lesson = LESSONS.find(x=>x.id===state.currentLessonId); if (lesson.audioUrl) new Audio(lesson.audioUrl).play(); else speakTextEL(lesson.text); return; }
  else if (act==='playword') {
    const lesson = LESSONS.find(x=>x.id===state.currentLessonId);
    playSingleWord(lesson, state.highlightMode, id);
    return;
  }
  else if (act==='startmimicry') {
    state.mimicryStage='recording'; render();
    const ok = await startRecording();
    if (!ok) { state.mimicryStage='recorded'; render(); return; }
    setTimeout(async () => { await stopRecordingAndSave('mimicry', state.currentLessonId); state.mimicryStage='recorded'; render(); }, 3000);
    return;
  }
  else if (act==='resetmimicry') { state.mimicryStage='idle'; state.myRecordingUrl=null; }
  else if (act==='finishmimicry') { state.screen='lesson'; state.mimicryStage='idle'; saveLessonProgress(state.currentLessonId,'completed'); logActivity(); }
  else if (act==='playmine') { if(state.myRecordingUrl) new Audio(state.myRecordingUrl).play(); return; }
  else if (act==='startfluency') {
    state.fluencyStage='reading'; state.fluencyElapsed=0; render();
    await startRecording();
    fluencyTimer = setInterval(() => { state.fluencyElapsed++; render(); }, 1000);
    return;
  }
  else if (act==='finishfluency') {
    if (fluencyTimer) clearInterval(fluencyTimer);
    const fluencyText = 'صباحُ الخيرِ يا جارتي، كيف حالُك اليوم؟ الشايُ جاهزٌ، تفضّلي واجلسي معنا قليلًا.';
    await stopRecordingAndSave('fluency', null, state.fluencyElapsed);
    await recordFluencyWpm(fluencyText, state.fluencyElapsed);
    state.fluencyStage='done'; logActivity();
    await loadProgressStats();
  }
  else if (act==='logout') { await sb.auth.signOut(); state.userId=null; state.track=null; state.screen='splash'; }
  else if (act==='copyshare') {
    const link = `${location.origin}${location.pathname}?share=${state.shareCode}`;
    try { await navigator.clipboard.writeText(link); state.shareCopied = true; setTimeout(() => { state.shareCopied = false; render(); }, 2000); } catch(e) {}
  }
  else if (act==='enablenotif') { await enableReminders(); }
  render();
});

init();
</script>
</body>
</html>
